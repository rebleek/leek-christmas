    notes: String(f.get('notes') || '').trim()
  };
}

function giftItemHTML(r, g) {
  const url = looksLikeUrl(g.where);
  const meta = [g.where ? (url ? hostOf(g.where) : g.where) : '', g.notes || ''].filter(Boolean);
  return `
    <li class="item${g.status === 'Given' ? ' is-done' : ''}">
      <button class="item-main" data-action="edit-gift" data-rid="${esc(r.id)}" data-id="${esc(g.id)}" aria-label="Edit gift: ${esc(g.name)}">
        <span class="item-title">${esc(g.name)}</span>
        ${meta.length ? `<span class="item-meta">${meta.map(m => `<span>${esc(truncate(m, 48))}</span>`).join('')}</span>` : ''}
      </button>
      ${url ? `<a class="icon-btn" href="${esc(g.where)}" target="_blank" rel="noopener noreferrer" aria-label="Open link for ${esc(g.name)}">${icon('link')}</a>` : ''}
      <div class="gift-side">
        ${g.price ? `<span class="item-side">${money(g.price)}</span>` : ''}
        <select class="status-select status-${esc(g.status || 'Idea')}" data-change="gift-status" data-rid="${esc(r.id)}" data-id="${esc(g.id)}" aria-label="Status of ${esc(g.name)}">
          ${GIFT_STATUSES.map(x => opt(x, x, g.status || 'Idea')).join('')}
        </select>
      </div>
    </li>`;
}

function recipientCardHTML(r) {
  const gifts = giftsOf(r);
  const spent = Calc.recipientSpent(r);
  const ideas = Calc.recipientIdeas(r);
  const budget = r.budget || 0;
  const over = budget > 0 && spent > budget;
  const ideaCount = gifts.filter(g => !BOUGHT_STATUSES.includes(g.status)).length;
  const counts = gifts.length
    ? `${plural(gifts.length, 'gift')}${ideaCount ? ` · ${ideaCount} to buy` : ''}`
    : 'No gifts yet';
  const status = over
    ? `<span class="over-text">${money(spent - budget)} over budget</span>`
    : Calc.isSorted(r) ? `<span class="ok-text">All sorted</span>` : `<span>${esc(counts)}</span>`;
  const budgetText = budget > 0 ? `<span><strong>${money(spent)}</strong> of ${money(budget)}</span>` : `<span><strong>${money(spent)}</strong> spent · no budget set</span>`;

  return `
    <details class="card recipient" data-rid="${esc(r.id)}" ${openRecipients.has(r.id) ? 'open' : ''}>
      <summary>
        <div class="recipient-top">
          <h3>${esc(r.name)}</h3>
          <span class="pill">${esc(r.group || 'Other')}</span>
          <svg class="icon chev" aria-hidden="true"><use href="#i-chevron"/></svg>
        </div>
        ${budget > 0 ? barHTML(spent, budget, `Spent on ${r.name}`) : ''}
        <div class="money-line">${budgetText}${status}</div>
        ${ideas && !over ? `<div class="money-line"><span>${money(ideas)} more in ideas${budget > 0 && spent + ideas > budget ? ` · <span class="over-text">would go ${money(spent + ideas - budget)} over</span>` : ''}</span></div>` : ''}
      </summary>
      <div class="recipient-body">
        ${gifts.length ? `<ul class="list gift-list">${gifts.map(g => giftItemHTML(r, g)).join('')}</ul>` : `<p class="muted small" style="padding:12px 6px 0">No gift ideas yet.</p>`}
        <div class="btn-row">
          <button class="btn btn-sm btn-primary" data-action="add-gift" data-rid="${esc(r.id)}">${icon('plus')}Add gift</button>
          <button class="btn btn-sm btn-ghost" data-action="edit-recipient" data-rid="${esc(r.id)}">${icon('edit')}Edit ${esc(truncate(r.name, 16))}</button>
        </div>
      </div>
    </details>`;
}

function GiftsView(s) {
  const prefs = s.settings.prefs;
  const group = prefs.giftGroup && (prefs.giftGroup === 'all' || GIFT_GROUPS.includes(prefs.giftGroup)) ? prefs.giftGroup : 'all';
  const all = s.recipients;
  const visible = all.filter(r => group === 'all' || r.group === group)
    .sort((a, b) => String(a.name).localeCompare(String(b.name), 'en-GB'));
  const sorted = all.filter(Calc.isSorted).length;
  const allGifts = all.flatMap(giftsOf);
  const statusCounts = GIFT_STATUSES.map(st => [st, allGifts.filter(g => (g.status || 'Idea') === st).length]);
  const spent = Calc.giftsSpent(s);
  const budgeted = sum(all, r => r.budget);
  const overPeople = all.filter(r => r.budget > 0 && Calc.recipientSpent(r) > r.budget);

  const sub = all.length
    ? `${sorted} of ${plural(all.length, 'person', 'people')} sorted`
    : 'Who you’re buying for, and what.';

  const summary = all.length ? `
    <section class="card" aria-label="Gift summary">
      <div class="section-head"><h2>${sorted} of ${all.length} sorted</h2><span class="muted">${all.length - sorted} outstanding</span></div>
      <div style="margin-top:10px">${barHTML(sorted, all.length, 'Recipients sorted', 'gold')}</div>
      <div class="stats" style="margin-top:14px">
        <div class="stat"><div class="k">Spent</div><div class="v">${money(spent)}</div></div>
        <div class="stat"><div class="k">Budgeted</div><div class="v">${money(budgeted)}</div></div>
        <div class="stat"><div class="k">Ideas to buy</div><div class="v">${statusCounts[0][1]}</div></div>
      </div>
      <p class="muted small" style="margin-top:12px">${statusCounts.map(([st, n]) => `${st} ${n}`).join(' · ')}</p>
      ${overPeople.length ? `<div class="notice danger" style="margin-top:12px">${icon('info')}<div>Over budget for ${esc(overPeople.map(r => r.name).join(', '))}.</div></div>` : ''}
    </section>` : '';

  const chip = (value, label) => `
    <button class="chip" data-action="gift-group" data-value="${esc(value)}" aria-pressed="${group === value}">
      ${esc(label)}<span class="count">${all.filter(r => value === 'all' || r.group === value).length}</span>
    </button>`;
  const usedGroups = GIFT_GROUPS.filter(g => all.some(r => r.group === g));

  let list;
  if (!all.length) list = emptyCard('gift', 'Who are you buying for?', 'Add each person above with a budget, then add gift ideas to their card as they come to you.');
  else if (!visible.length) list = emptyCard('gift', `No one in ${group}`, 'People you add to this group will appear here.');
  else list = `<div class="cards">${visible.map(recipientCardHTML).join('')}</div>`;

  return `
    ${pageHead('Gifts', sub)}
    <div class="stack">
      <form class="card add-card" data-submit="add-recipient" autocomplete="off">
        ${recipientFields({ ...recipientDraft, group: group !== 'all' ? group : recipientDraft.group }, 'recipient')}
      </form>
      ${summary}
      ${usedGroups.length > 1 ? `<div class="chips" role="group" aria-label="Filter by group">${chip('all', 'Everyone')}${usedGroups.map(g => chip(g, g)).join('')}</div>` : ''}
      ${list}
    </div>`;
}

const findRecipient = id => Store.get().recipients.find(r => r.id === id);

const GiftActions = {
  'gift-group'(el) { Store.update(s => { s.settings.prefs.giftGroup = el.dataset.value; }); },
  async 'add-gift'(el) {
    const r = findRecipient(el.dataset.rid);
    if (!r) return;
    const res = await formDialog({ title: `Gift for ${r.name}`, body: giftFields({}), submitLabel: 'Add gift' });
    if (!res) return;
    const values = readGiftForm(res.data);
    if (!values.name) return;
    openRecipients.add(r.id);
    Store.update(s => { const x = s.recipients.find(y => y.id === r.id); if (x) { x.gifts = giftsOf(x); x.gifts.push({ id: uid(), ...values }); } });
  },
  async 'edit-gift'(el) {
    const r = findRecipient(el.dataset.rid);
    const g = r && giftsOf(r).find(x => x.id === el.dataset.id);
    if (!g) return;
    const res = await formDialog({ title: `Gift for ${r.name}`, body: giftFields(g), deleteLabel: 'Delete' });
    if (!res) return;
    if (res.action === 'delete') {
      let index = -1, removed = null;
      Store.update(s => {
        const x = s.recipients.find(y => y.id === r.id);
        index = giftsOf(x).findIndex(y => y.id === g.id);
        if (index > -1) [removed] = x.gifts.splice(index, 1);
      });
      if (removed) toast(`Deleted “${truncate(g.name)}”`, 'info', { label: 'Undo', run: () => Store.update(s => {
        const x = s.recipients.find(y => y.id === r.id);
        if (x) { x.gifts = giftsOf(x); x.gifts.splice(Math.min(index, x.gifts.length), 0, removed); }
      }) });
      return;
    }
    const values = readGiftForm(res.data);
    if (!values.name) return;
    Store.update(s => { const x = s.recipients.find(y => y.id === r.id); const y = x && giftsOf(x).find(z => z.id === g.id); if (y) Object.assign(y, values); });
  },
  async 'edit-recipient'(el) {
    const r = findRecipient(el.dataset.rid);
    if (!r) return;
    const res = await formDialog({ title: `Edit ${r.name}`, body: recipientFields(r), deleteLabel: 'Delete' });
    if (!res) return;
    if (res.action === 'delete') return removeWithUndo('recipients', r.id, r.name);
    const values = readRecipientForm(res.data);
    if (!values.name) return;
    Store.update(s => { const x = s.recipients.find(y => y.id === r.id); if (x) Object.assign(x, values); });
  }
};

const GiftChanges = {
  'gift-status'(el) {
    const { rid, id } = el.dataset;
    el.className = `status-select status-${el.value}`;
    Store.update(s => {
      const r = s.recipients.find(x => x.id === rid);
      const g = r && giftsOf(r).find(x => x.id === id);
      if (g) g.status = el.value;
    });
    // Re-render replaced the select; put focus back on its replacement.
    document.querySelector(`select[data-change="gift-status"][data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
  }
};

const GiftSubmits = {
  'add-recipient'(form) {
    const values = readRecipientForm(new FormData(form));
    if (!values.name) return;
    recipientDraft.group = values.group;
    const id = uid();
    openRecipients.add(id);
    Store.update(s => { s.recipients.push({ id, ...values, gifts: [] }); });
    $('#recipient-name')?.focus();
    toast(`Added ${truncate(values.name)}`);
  }
};

// Remember which recipient cards are open across re-renders. `toggle` doesn't bubble, so capture it.
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d instanceof HTMLDetailsElement && d.dataset.more === 'food') { foodDraft.open = d.open; return; }
  if (!(d instanceof HTMLDetailsElement) || !d.dataset.rid) return;
  if (d.open) openRecipients.add(d.dataset.rid); else openRecipients.delete(d.dataset.rid);
}, true);

const expenseDraft = { categoryId: 'decorations' };
const expenseCats = s => s.budget.categories.filter(c => !c.source);
const SOURCE_LABEL = { gifts: 'From Gifts', food: 'From Food' };

function expenseFields(e, cats, idPrefix) {
  return `
    ${addRow(idPrefix, fieldHTML(idPrefix ? 'Log an expense' : 'Description', `<input class="input" ${idPrefix ? `id="${idPrefix}-desc"` : ''} name="description" required pattern=".*\\S.*" maxlength="120" value="${esc(e.description || '')}" placeholder="e.g. Fairy lights" autocomplete="off">`))}
    <div class="form-grid">
      ${moneyField('Amount', 'amount', e.amount, 'required')}
      ${fieldHTML('Category', `<select class="select" name="categoryId">${cats.map(c => opt(c.id, c.name, e.categoryId)).join('')}</select>`)}

function readExpenseForm(f, cats) {
  const c = f.get('categoryId');

    description: String(f.get('description') || '').trim(),
    amount: Math.max(0, toPence(f.get('amount'))),

  };
}

function categoryRowHTML(c) {
  const right = c.allocated > 0
    ? (c.over ? `<span class="over-text">${money(-c.remaining)} over</span>` : `<span>${money(c.remaining)} left</span>`)
    : (c.spent > 0 ? `<span class="over-text">Nothing allocated</span>` : `<span>Not allocated</span>`);
  return `
    <li class="budget-row">
      <div class="budget-row-top">
        <span class="label">${esc(c.name)}${c.source ? `<span class="pill">${SOURCE_LABEL[c.source] || 'Auto'}</span>` : ''}</span>
        <button class="icon-btn" data-action="edit-category" data-id="${esc(c.id)}" aria-label="Edit ${esc(c.name)} budget">${icon('edit')}</button>
      </div>
      ${barHTML(c.spent, c.allocated, `${c.name} spent`)}
      <div class="money-line"><span><strong>${money(c.spent)}</strong> of ${money(c.allocated)}</span>${right}</div>
    </li>`;
}

function expenseItemHTML(e, catName) {
  return `
    <li class="item">
      <button class="item-main" data-action="edit-expense" data-id="${esc(e.id)}" aria-label="Edit expense: ${esc(e.description)}">
        <span class="item-title">${esc(e.description)}</span>
        <span class="item-meta"><span>${esc(catName)}</span><span>${esc(fmtDate(e.date, { day: 'numeric', month: 'short', year: 'numeric' }))}</span></span>
      </button>
      <span class="item-side">${money(e.amount)}</span>
      <button class="icon-btn" data-action="delete-expense" data-id="${esc(e.id)}" aria-label="Delete expense: ${esc(e.description)}">${icon('trash')}</button>
    </li>`;
}

function BudgetView(s) {
  const b = Calc.budget(s);
  const cats = expenseCats(s);
  const catName = id => s.budget.categories.find(c => c.id === id)?.name || 'Other';
  const expenses = [...s.expenses].sort((x, y) => String(y.date).localeCompare(String(x.date)));

  const sub = b.total > 0
    ? (b.over ? `<strong style="color:var(--red)">${money(-b.remaining)} over budget</strong>` : `${money(b.remaining)} left of ${money(b.total)}`)
    : 'Set a total, split it into categories, and track spending.';

  const warnings = [];
  if (b.over) warnings.push(['danger', `You’ve spent ${money(b.spent)}, which is ${money(-b.remaining)} over your ${money(b.total)} budget.`]);
  const overCats = b.cats.filter(c => c.over && c.allocated > 0);
  if (overCats.length) warnings.push(['danger', `Over budget in ${overCats.map(c => c.name).join(', ')}.`]);
  if (b.total > 0 && b.unallocated < 0) warnings.push(['danger', `Your categories add up to ${money(b.allocated)}, which is ${money(-b.unallocated)} more than your total.`]);
  else if (b.total > 0 && b.unallocated > 0) warnings.push(['info', `${money(b.unallocated)} of your budget isn’t allocated to a category yet.`]);

  const overview = `
    <section class="card" aria-label="Budget overview">
      <div class="section-head">
        <h2>${b.total > 0 ? `${money(b.total)} budget` : 'No total budget set'}</h2>
        <button class="btn btn-sm" data-action="edit-total">${icon('edit')}${b.total > 0 ? 'Edit' : 'Set budget'}</button>
      </div>
      ${b.total > 0 ? `<div style="margin-top:12px">${barHTML(b.spent, b.total, 'Overall spent')}</div>` : ''}
      <div class="stats" style="margin-top:14px">
        <div class="stat"><div class="k">Allocated</div><div class="v">${money(b.allocated)}</div></div>
        <div class="stat"><div class="k">Spent</div><div class="v">${money(b.spent)}</div></div>
        <div class="stat"><div class="k">Remaining</div><div class="v"${b.over ? ' style="color:var(--red)"' : ''}>${money(b.remaining)}</div></div>
      </div>
      ${warnings.map(([kind, text]) => `<div class="notice${kind === 'danger' ? ' danger' : ''}" style="margin-top:12px">${icon('info')}<div>${esc(text)}</div></div>`).join('')}
    </section>`;

  return `
    ${pageHead('Budget', sub)}
    <div class="stack">
      ${overview}
      <section class="card list-card" aria-labelledby="budget-cats">
        <div class="section-head"><h2 id="budget-cats">Categories</h2><button class="btn btn-sm btn-ghost" data-action="add-category">${icon('plus')}Add</button></div>
        <ul class="list">${b.cats.map(categoryRowHTML).join('')}</ul>
        <p class="muted small" style="padding:4px 6px 6px">Gifts count once they’re marked Bought. Food counts once it’s ticked off.</p>
      </section>
      <form class="card add-card" data-submit="add-expense" autocomplete="off">
        ${expenseFields({ categoryId: cats.some(c => c.id === expenseDraft.categoryId) ? expenseDraft.categoryId : cats[0]?.id }, cats, 'expense')}
      </form>
      ${expenses.length ? `
        <section class="card list-card" aria-labelledby="budget-exp">
          <div class="section-head"><h2 id="budget-exp">Expenses</h2><span class="muted">${money(sum(expenses, e => e.amount))}</span></div>
          <ul class="list">${expenses.map(e => expenseItemHTML(e, catName(e.categoryId))).join('')}</ul>
        </section>` : emptyCard('pound', 'No expenses logged', 'Log decorations, nights out, travel and anything else here. Gifts and food are counted automatically.')}
    </div>`;
}

function categoryFields(c) {
  return `
    ${c.source
      ? `<p class="muted">${esc(c.name)} spending comes from the ${c.source === 'gifts' ? 'Gifts' : 'Food Shopping'} page automatically.</p>`
      : fieldHTML('Name', `<input class="input" name="name" required pattern=".*\\S.*" maxlength="40" value="${esc(c.name || '')}" autocomplete="off">`)}
    ${moneyField('Allocated', 'allocated', c.allocated)}`;
}

const BudgetActions = {
  async 'edit-total'() {
    const s = Store.get();
    const res = await formDialog({
      title: 'Christmas budget',
      body: `${moneyField('Total budget', 'total', s.budget.total, 'required')}<p class="muted small">Then split it across categories below.</p>`
    });
    if (!res) return;
    Store.update(st => { st.budget.total = Math.max(0, toPence(res.data.get('total'))); });
  },
  async 'edit-category'(el) {
    const c = Store.get().budget.categories.find(x => x.id === el.dataset.id);
    if (!c) return;
    const deletable = !c.source && c.id !== 'other';
    const res = await formDialog({ title: c.name, body: categoryFields(c), deleteLabel: deletable ? 'Delete' : null });
    if (!res) return;
    if (res.action === 'delete') {
      const n = Store.get().expenses.filter(e => e.categoryId === c.id).length;
      const ok = await confirmDialog({
        title: `Delete ${c.name}?`,
        body: n ? `<p>Its ${esc(plural(n, 'expense'))} will move to Other.</p>` : '<p>This category has no expenses.</p>',
        confirmLabel: 'Delete category', danger: true
      });
      if (!ok) return;
      Store.update(s => {
        s.budget.categories = s.budget.categories.filter(x => x.id !== c.id);
        s.expenses.forEach(e => { if (e.categoryId === c.id) e.categoryId = 'other'; });
      });
      return;
    }
    const name = String(res.data.get('name') ?? c.name).trim() || c.name;
    const allocated = Math.max(0, toPence(res.data.get('allocated')));
    Store.update(s => { const x = s.budget.categories.find(y => y.id === c.id); if (x) Object.assign(x, { name, allocated }); });
  },
  async 'add-category'() {
    const res = await formDialog({ title: 'New category', body: categoryFields({}), submitLabel: 'Add' });
    if (!res) return;
    const name = String(res.data.get('name') || '').trim();
    if (!name) return;
    Store.update(s => { s.budget.categories.push({ id: uid(), name, allocated: Math.max(0, toPence(res.data.get('allocated'))) }); });
  },
  async 'edit-expense'(el) {
    const s = Store.get();
    const e = s.expenses.find(x => x.id === el.dataset.id);
    if (!e) return;
    const cats = expenseCats(s);

/* =========================================================
   Readiness (Prep Tracker + Dashboard)
   ========================================================= */
const PREP_AREAS = [
  { id: 'todo', label: 'To-Do', href: '#todo', noun: 'tasks done' },
  { id: 'food', label: 'Food', href: '#food', noun: 'items bought' },
  { id: 'gifts', label: 'Gifts', href: '#gifts', noun: 'gifts wrapped or given' },
  { id: 'milestones', label: 'Prep milestones', href: '#prep', noun: 'milestones done' }
];

Object.assign(Calc, {
  prep(s) {
    const allGifts = s.recipients.flatMap(giftsOf);
    const counts = {
      todo: [s.todos.filter(t => t.done).length, s.todos.length],
      food: [s.food.filter(f => f.bought).length, s.food.length],
      gifts: [allGifts.filter(g => g.status === 'Wrapped' || g.status === 'Given').length, allGifts.length],
      milestones: [s.milestones.filter(m => m.done).length, s.milestones.length]
    };
    const areas = PREP_AREAS.map(a => {
      const [done, total] = counts[a.id];
      return { ...a, done, total, pct: total ? Math.round((done / total) * 100) : null, weight: Math.max(0, Number(s.settings.weights[a.id]) || 0) };
    });
    // Areas with nothing in them yet don't count. If every weight is zero, fall back to equal weights.
    let counted = areas.filter(a => a.total > 0 && a.weight > 0);
    if (!counted.length) counted = areas.filter(a => a.total > 0).map(a => ({ ...a, weight: 1 }));
    const wsum = sum(counted, a => a.weight);
    const headline = wsum ? Math.round((sum(counted, a => a.weight * (a.done / a.total)) / wsum) * 100) : 0;
    return { areas, headline, pace: Calc.pace(headline), budget: Calc.budgetStatus(s) };
  },

  // Compare readiness with how far we are between 1 November and Christmas Eve.
  pace(headline, now = new Date()) {
    if (christmasInfo(now).isDay) return { state: 'done', expected: 100, label: 'Merry Christmas', text: 'It’s Christmas Day — enjoy it.' };
    const y = christmasYear();
    const start = new Date(y, 10, 1), end = new Date(y, 11, 24);
    if (now < start) {
      return { state: 'on', expected: 0, label: 'On pace',
        text: headline > 0 ? 'Prep season starts on 1 November, so you’re ahead of the game.' : 'Prep season starts on 1 November.' };
    }
    const expected = Math.round(Math.min(1, (now - start) / (end - start)) * 100);
    const onPace = headline >= expected;
    return { state: onPace ? 'on' : 'behind', expected, label: onPace ? 'On pace' : 'Behind',
      text: onPace ? `About ${expected}% is on track for today. You’re at ${headline}%.`
        : `About ${expected}% would be on track for today. You’re ${expected - headline} points behind.` };
  },

  budgetStatus(s) {
    const b = Calc.budget(s);
    if (!b.total) return { state: 'unset', label: 'No budget set', cls: 'gold' };
    if (b.over) return { state: 'over', label: `${money(-b.remaining)} over budget`, cls: 'bad' };
    const overCats = b.cats.filter(c => c.over && c.allocated > 0).length;
    if (overCats) return { state: 'warn', label: `On track overall · ${plural(overCats, 'category', 'categories')} over`, cls: 'warn' };
    return { state: 'ok', label: `On track · ${money(b.remaining)} left`, cls: 'ok' };
  }
});

const paceClass = p => (p.state === 'behind' ? 'bad' : 'ok');

function ringHTML(p, size = 132, stroke = 11, labelSize = '2rem', caption = 'ready') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `
    <div class="ring-wrap" style="width:${size}px;height:${size}px" role="img" aria-label="${p}% ready">
      <svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
        <circle class="ring-track" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}"/>
        <circle class="ring-fill" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}"
          stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - p / 100)).toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
      </svg>
      <div class="ring-label" aria-hidden="true"><div><strong style="font-size:${labelSize}">${p}%</strong>${caption ? `<div class="small" style="opacity:.8">${caption}</div>` : ''}</div></div>
    </div>`;
}

/* =========================================================
   Actions (event delegation)
   ========================================================= */
const Actions = {
  async export() {
    const s = Store.get();
    const payload = { app: 'christmas-planner', exportedAt: new Date().toISOString(), ...s };
    const json = JSON.stringify(payload, null, 2);
    const name = `christmas-planner-backup-${isoDate()}.json`;
    const blob = new Blob([json], { type: 'application/json' });

    // iOS home-screen apps can't trigger downloads reliably, so use the share sheet there.
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    let shared = false;
    if (standalone && navigator.canShare) {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Christmas Planner backup' }); shared = true; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
    }
    if (!shared) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    Store.update(st => { st.meta.lastExportAt = new Date().toISOString(); });
    toast('Backup exported');
  },

  import() {
    const input = $('#import-file');
    input.value = '';
    input.click();
  },

  async reset() {
    const ok = await confirmDialog({
      title: 'Reset everything?',
      body: `<p>This permanently deletes all your tasks, food, gifts, budget and prep data on this device. You can’t undo this.</p>
             <p style="margin-top:8px">Tip: export a backup first.</p>`,
      confirmLabel: 'Delete everything',
      danger: true
    });
    if (!ok) return;
    const keepTheme = Store.get().settings.theme;
    Store.reset();
    Store.update(s => { s.settings.theme = keepTheme; });
    toast('All data reset');
  }
};

const Changes = {
  theme(el) {
    Store.update(s => { s.settings.theme = el.value; });
    applyTheme(el.value);
  },
  snow(el) {
    Store.update(s => { s.settings.snow = el.checked; });
    Snow.set(el.checked);
  }
};

const Submits = {};
Object.assign(Actions, TodoActions, FoodActions, GiftActions, BudgetActions, PrepActions);
Object.assign(Changes, TodoChanges, FoodChanges, GiftChanges, PrepChanges);
Object.assign(Submits, TodoSubmits, FoodSubmits, GiftSubmits, BudgetSubmits, PrepSubmits);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && Actions[el.dataset.action]) { e.preventDefault(); Actions[el.dataset.action](el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && Changes[el.dataset.change]) Changes[el.dataset.change](el, e);
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-submit]');
  if (form && Submits[form.dataset.submit]) { e.preventDefault(); Submits[form.dataset.submit](form, e); }
});

$('#import-file').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  let data;
  try {
    if (file.size > 5 * 1024 * 1024) throw new SchemaError('That file is too large to be a planner backup.');
    const parsed = JSON.parse(await file.text());
    delete parsed.app; delete parsed.exportedAt;
    data = migrate(parsed);
  } catch (err) {
    const msg = err instanceof SchemaError ? err.message : 'That file isn’t a valid planner backup.';
    toast(msg, 'error');
    return;
  }
  const c = summaryCounts(data);
  const when = data.meta.updatedAt ? new Date(data.meta.updatedAt).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : 'an unknown date';
  const ok = await confirmDialog({
    title: 'Restore this backup?',
    body: `<p>Backup from <strong>${esc(when)}</strong> containing:</p>
           <ul><li>${esc(plural(c.tasks, 'task'))}</li><li>${esc(plural(c.food, 'food item'))}</li>
           <li>${esc(plural(c.recipients, 'recipient'))} with ${esc(plural(c.gifts, 'gift'))}</li>
           <li>${esc(plural(c.expenses, 'expense'))}</li></ul>
           <p style="margin-top:8px">This will replace everything currently in the planner.</p>`,
    confirmLabel: 'Replace my data',
    danger: true
  });
  if (!ok) return;
  Store.replace(data);
  applyTheme(Store.get().settings.theme);
  Snow.set(Store.get().settings.snow);
  toast('Backup restored');
});
